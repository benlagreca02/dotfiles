# The current "theme"
source = ~/.config/theme/hyprlandColors.conf


label {
    monitor =
    # text = cmd[update:1000] echo "<span foreground='##ff2222'>$(date)</span>"
    text = cmd[update:1000] echo $TIME12
    color = rgb(255, 255, 255, 1.0)
    position = 0, 50
    font_family = Iosevka Term Semibold Extended
    font_size = 64
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = $BORDER_THICKNESS
    inner_color = rgba(100, 100, 100, 80.0) # no fill

    outer_color = $MAIN_COLOR $HIGHLIGHT_COLOR 15deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_family = Iosevka Term Semibold Extended
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = $BORDER_RADIUS

    position = 0, -50
    halign = center
    valign = center
}

background {
    monitor =
    path = $WALLPAPER_PATH
    # should tweak the colors probably
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

