#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
    # workspace_swipe = false
# }

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as mod key

# Many of my keybinds are simmilar to DWM's defaults
# DWM was my first minimal WM without a DE.
# DWM was too bare bones for me, I didn't want to modify src, confs are fine

#
# PROGRAM LAUNCHING 
# 

# W for web
bind = $mainMod, W, exec, $WEB_BROWSER
bind = $mainMod SHIFT, W, exec, OpenWebBookmarks

# E for files
bind = $mainMod, E, exec, $FILE_MANAGER

# F for "float"
bind = $mainMod, F, togglefloating

# Shift F for fullscreen
bind = $mainMod SHIFT, F, fullscreen

# P for Pin
bind = $mainMod, P, pin

# R for Reader/ Rss
bind = $mainMod, R, exec, $FEED_READER

# Space for Program launcher (rofi in drun mode)
bind = $mainMod, SPACE, exec, $LAUNCHER

# C for config editor
bind = $mainMod, C, exec, edit-config-selector

# T for theme changer
bind = $mainMod, T, exec, change_theme

# SHIFT Enter for terminal
bind = $mainMod SHIFT, RETURN, exec, $TERMINAL # uses environment variable


# Shift S for hyprshot (like snipping tool on windows)
bind = $mainMod SHIFT, S, exec, hyprshot --clipboard-only -m region

#
# System keybinds
#

# ABORT FROM HYPRLAND VIOLENTLY
bind = $mainMod, X, exit,

# C for close active (Stole this from DWM defaults I think)
bind = $mainMod SHIFT, C, killactive,

# Must use SHIFT L for lock because SUPER + L is for window focus changing
bind = $mainMod SHIFT, L, exec, hyprlock

# binde allows for repeating when held
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute, exec, pactl -- set-source-mute 0 toggle

# Monitor brightness control, needs brightnessctl installed
binde = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
binde = ,XF86MonBrightnessUp, exec, brightnessctl s +10%

# shift for fine grained brightness control
binde = SHIFT,XF86MonBrightnessDown, exec, brightnessctl s 1%-
binde = SHIFT,XF86MonBrightnessUp, exec, brightnessctl s +1%

# COMPLETELY EXITS HYPRLAND, goes back to SDDM
bind = $mainMod, M, exec, prompt_logoff

# Move focus with mainMod + vim keybinds
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Example special workspace (scratchpad)
# MOD+S opens scratchpad
# MOD+CTRL+SHIFT+S moves current window to scratchpad
# MOS+SHIFT+S is for snipping tool
# can use MOD+SHIFT+# to move from scratchpad to workspace #
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod CTRL SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
